name: Build NoVerticalCull
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Sodium for compilation
        run: |
          mkdir -p libs
          curl -sL 'https://api.modrinth.com/v2/project/sodium/version?game_versions=%5B%221.21.1%22%5D&loaders=%5B%22neoforge%22%5D' -o sodium.json
          URL=$(python3 -c "import json; d=json.load(open('sodium.json')); print(d[0]['files'][0]['url'])")
          echo "Sodium jar: $URL"
          curl -sL "$URL" -o libs/sodium-neoforge.jar

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: noverticalcull
          path: build/libs/*.jar
